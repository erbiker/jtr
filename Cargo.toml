[package]
name = "jtr"
version = "0.1.0"
edition = "2024"
description = "A package registry and CLI for sharing reusable just and task recipes"
license = "MIT OR Apache-2.0"
repository = "https://github.com/erbiker/jtr"
readme = "README.md"
keywords = ["just", "task", "recipes", "registry", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
  ".github/*",
  ".local/*",
  "jtr-index/*",
  "scripts/*",
  "tests/*",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "TESTING.md",
  "deny.toml",
  "justfile",
]

[[bin]]
name = "jtr"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
colored = "3"
directories = "5"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "3"
tempfile = "3"
toml = "0.8"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
sha2 = "0.10"
tempfile = "3"
tiny_http = "0.12"

[profile.release]
lto = "thin"
strip = true
