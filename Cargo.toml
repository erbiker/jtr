[package]
name = "jtr"
version = "0.1.0"
edition = "2024"
description = "A package registry and CLI for sharing reusable just and task recipes"
license = "MIT OR Apache-2.0"
repository = "https://github.com/erbiker/jtr"
readme = "README.md"
keywords = ["just", "task", "recipes", "registry", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "jtr"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
colored = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
sha2 = "0.10"
tempfile = "3"
tiny_http = "0.12"

[profile.release]
lto = "thin"
strip = true
