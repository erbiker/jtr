name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: install just (for smoke + validate-index)
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            brew install just
          else
            curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to ~/.cargo/bin
          fi

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test --all-features

      - name: smoke
        run: just smoke

      - name: validate-index
        run: just validate-index

  quality:
    name: dependency audit + format
    runs-on: ubuntu-latest
    # License / advisory / unused-dep / TOML-format checks are OS-independent —
    # no need to run them on every matrix slot. One Linux run is sufficient.
    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: install cargo-deny, cargo-machete, taplo
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete,taplo

      - name: cargo deny check
        run: cargo deny check

      - name: cargo machete
        run: cargo machete

      - name: taplo fmt --check
        run: taplo fmt --check
