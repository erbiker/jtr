name: release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

permissions:
  contents: write

jobs:
  verify:
    name: verify tag is releasable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: install just
        run: curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to ~/.cargo/bin

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: install cargo-deny, cargo-machete, taplo
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete,taplo

      - name: just check
        run: just check

      - name: just smoke
        run: just smoke

      - name: just validate-index
        run: just validate-index

      - name: cargo publish --dry-run --locked
        run: cargo publish --dry-run --locked

      - name: verify tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME}"
          tag_version="${tag#v}"
          crate_version=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)
          if [ "$tag_version" != "$crate_version" ]; then
            echo "tag $tag (version $tag_version) does not match Cargo.toml version $crate_version" >&2
            exit 1
          fi
          echo "tag $tag matches Cargo.toml version $crate_version"

  build:
    name: build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          stage="jtr-${version}-${{ matrix.target }}"
          mkdir "$stage"
          cp "target/${{ matrix.target }}/release/jtr" "$stage/"
          cp README.md LICENSE-MIT LICENSE-APACHE CHANGELOG.md "$stage/"
          tar -czf "${stage}.tar.gz" "$stage"
          shasum -a 256 "${stage}.tar.gz" > "${stage}.tar.gz.sha256"
          echo "ASSET=${stage}.tar.gz" >> "$GITHUB_ENV"
          echo "ASSET_SHA=${stage}.tar.gz.sha256" >> "$GITHUB_ENV"

      - name: package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          $stage = "jtr-${version}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/jtr.exe" "$stage/"
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE, CHANGELOG.md "$stage/"
          Compress-Archive -Path $stage -DestinationPath "${stage}.zip"
          $hash = (Get-FileHash "${stage}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${stage}.zip" | Out-File -FilePath "${stage}.zip.sha256" -Encoding ascii
          "ASSET=${stage}.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "ASSET_SHA=${stage}.zip.sha256" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jtr-${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET_SHA }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: publish github release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: combined SHA256SUMS
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          ls -la

      - name: create github release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes_file=$(mktemp)
          awk -v tag="${tag#v}" '
            $0 ~ "^## \\[" tag "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > "$notes_file"
          if [ ! -s "$notes_file" ]; then
            echo "No release notes found for ${tag} in CHANGELOG.md; using a placeholder." >&2
            echo "Release ${tag}." > "$notes_file"
          fi
          gh release create "$tag" \
            --title "$tag" \
            --notes-file "$notes_file" \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS
